[project]
name = "product-lens"
version = "0.1.0"
description = "Build the product index on a PC GPU and hand it to the Product Lens app."
requires-python = ">=3.10,<3.14"
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    # EmbeddingGemma 2 needs transformers 5; sentence-transformers 5.1+ reads its multimodal inputs in order.
    "sentence-transformers>=5.1",
    "transformers>=5",
    "numpy",
    "pillow",
    "rich>=13",
    "qrcode>=8",
]

[project.scripts]
lens = "lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lens"]

# CUDA builds of torch on Windows and Linux (macOS has no CUDA and takes PyPI's build). cu126 covers RTX 20/30/40 and
# older; an RTX 50 needs cu130 (change the URL below, then `uv sync`).
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
